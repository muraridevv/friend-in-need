services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: friendinneed
      POSTGRES_USER: friend
      POSTGRES_PASSWORD: friend
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friend -d friendinneed"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  postgres-data:
